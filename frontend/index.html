            <!-- Add HelloGreet section -->
            <div id="HelloGreet" hidden>
              <h2 class="text-center">Welcome to Jarvis</h2>
              <p id="WishMessage" class="text-center">Your personal assistant is ready</p>
            </div>
            
            <!-- Add FaceAuth section -->
            <div id="FaceAuth" hidden>
              <h2 class="text-center">Face Authentication</h2>
              <p class="text-center">Please look at the camera</p>
              <div class="d-flex justify-content-center">
                <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">Loading...</span>
                </div>
              </div>
            </div>
            
            <!-- Add FaceAuthSuccess section -->
            <div id="FaceAuthSuccess" hidden>
              <h2 class="text-center">Authentication Successful</h2>
              <p class="text-center">Welcome back!</p>
              <div class="d-flex justify-content-center">
                <i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;"></i>
              </div>
            </div>
          </div>

  </section>

  <section id="Oval" class="mb-4" hidden>
    <div class="row">
      <div class="col-lg-12">
        <div class="d-flex justify-content-center align-items-center">
          <div class="text-center">
            <div id="MicBtn" class="mic-btn">
              <i class="bi bi-mic-fill" style="font-size: 2rem;"></i>
            </div>
            <div id="SendBtn" class="send-btn" hidden>
              <i class="bi bi-send-fill" style="font-size: 2rem;"></i>
            </div>
            <div class="mt-3">
              <input type="text" id="chatbox" class="form-control" placeholder="Type your message...">
            </div>
            <div class="mt-3">
              <ul class="siri-message">
                <li>How can I help you?</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="SiriWave" class="mb-4" hidden>
    <div class="row">
      <div class="col-lg-12">
        <div class="d-flex justify-content-center align-items-center">
          <div id="siri-container"></div>
        </div>
      </div>
    </div>
  </div>
